<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 瞎折腾吧户型绘制工具：圆角底板 + 户型墙体 + 门弧 + 铅笔 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- 房间地面 -->
  <rect x="12" y="13" width="40" height="38" rx="1.5" fill="#e0f2fe"/>
  <rect x="31" y="13" width="21" height="17" fill="#fde68a"/>
  <!-- 外墙 -->
  <path d="M12 13 H52 V51 H12 Z" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- 内墙 -->
  <path d="M31 13 V24 M31 30 H52 M31 30 V36" fill="none" stroke="#0f172a" stroke-width="3.2" stroke-linecap="square"/>
  <!-- 门弧 -->
  <path d="M31 36 V44 A8 8 0 0 0 39 36" fill="none" stroke="#0284c7" stroke-width="1.6"/>
  <!-- 铅笔 -->
  <g transform="rotate(-45 46 46)">
    <rect x="40" y="42.5" width="16" height="7" rx="1" fill="#f97316" stroke="#ffffff" stroke-width="1.4"/>
    <path d="M40 42.5 L34 46 L40 49.5 Z" fill="#fde68a" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M35.8 45 L34 46 L35.8 47 Z" fill="#0f172a"/>
  </g>
</svg>
